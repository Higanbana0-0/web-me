<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เกี่ยวกับเรา</title>
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/product.css" />
    <link rel="stylesheet" href="css/detail.css" />
    <link rel="stylesheet" href="css/about.css" />
</head>
<body>
  <iframe
      id="menuFrame"
      src="menu.html"
      title="Menu"
      class="menu-iframe"
      style="width:100%; height:60px; border:none; overflow: hidden; display:block;"
      scrolling="no"
  ></iframe>

  <script>
    const menuFrame = document.getElementById('menuFrame');
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'set-menu-height' && menuFrame) {
        menuFrame.style.height = `${Math.max(60, Number(event.data.height) || 60)}px`;
      }
    });
  </script>

    <section class="about-company">
      <div class="company-image">
        <img src="img/สกรีนช็อต 2026-05-28 202932.png" alt="รูปบริษัท" />
      </div>
      <div class = "company-details">
        <h2>Manga</h2>
        <div class="red-line"></div>

        <div class="info-table">
          <div class="info-row">
            <div class="info-label">ชื่อบริษัท:</div>
            <div class="info-value">Manga</div>
          </div>
          <div class="info-row">
            <div class="info-label">วันที่ก่อตั้ง:</div>
            <div class="info-value">1 มกราคม 2560</div>
          </div>
          <div class="info-row">
            <div class="info-label">ที่อยู่:</div>
            <div class="info-value">777 ถนนจีนแดง แขวงท่าพระ  เขต แอฟริกา 99741</div>
          </div>
          <div class="info-row">
          <div class="info-label">มาตรฐานเว็บไซต์:</div>
          <div class="info-value">สุดยอดเว็บไซต์ </div>
        </div>
        </div>
      </div>
    </section>
</body>
</html>
