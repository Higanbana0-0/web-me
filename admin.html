<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Manga</title>
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/product.css" />
    <link rel="stylesheet" href="css/detail.css" />
    <style>
      body {
        margin: 0;
        background: linear-gradient(180deg, #0a0c12 0%, #111827 100%);
        color: #f3f4f6;
        font-family: Arial, Helvetica, sans-serif;
      }

      .admin-wrap {
        max-width: 1100px;
        margin: 40px auto;
        padding: 0 20px 60px;
      }

      .admin-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 24px;
      }

      .admin-header h1 {
        margin: 0;
        font-size: clamp(1.8rem, 2vw, 2.4rem);
      }

      .profile-widget {
        min-width: 220px;
        background: rgba(15, 23, 42, 0.75);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 14px;
        padding: 12px 14px;
        color: #e2e8f0;
        line-height: 1.7;
        text-align: left;
      }

      .admin-panel {
        display: grid;
        grid-template-columns: 1fr 1.4fr;
        gap: 24px;
      }

      .card {
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        padding: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      }

      .card h2, .card h3 {
        margin-top: 0;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 0.95rem;
        color: #e5e7eb;
      }

      input, textarea {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid rgba(148, 163, 184, 0.3);
        border-radius: 10px;
        background: rgba(15, 23, 42, 0.9);
        color: #f8fafc;
        padding: 12px 14px;
        font-size: 1rem;
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      .chapter-inline {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      .chapter-inline input {
        width: 110px;
        min-width: 110px;
      }

      .chapter-list-editor {
        display: grid;
        gap: 10px;
        margin-top: 8px;
      }

      .chapter-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        padding: 8px 10px;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 10px;
        background: rgba(15, 23, 42, 0.65);
      }

      .chapter-row label {
        flex: 1;
        min-width: 120px;
      }

      .chapter-row input {
        width: 100%;
      }

      .page-image-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
        width: 100%;
        margin-top: 8px;
      }

      .page-image-card {
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 10px;
        background: rgba(2, 6, 23, 0.72);
        padding: 10px;
      }

      .page-image-card input[type="file"] {
        margin-bottom: 8px;
      }

      .page-image-card input[type="url"] {
        margin-bottom: 8px;
      }

      .page-image-preview {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 110px;
        border: 1px dashed rgba(148, 163, 184, 0.35);
        border-radius: 8px;
        overflow: hidden;
        background: rgba(15, 23, 42, 0.9);
        color: #cbd5e1;
        font-size: 0.8rem;
      }

      .page-image-preview img {
        display: block;
        width: 100%;
        height: 110px;
        object-fit: cover;
      }

      .delete-page-image-btn,
      .chapter-row .remove-chapter-btn {
        padding: 8px 10px;
        font-size: 0.8rem;
        background: rgba(239, 68, 68, 0.12);
        border: 1px solid rgba(239, 68, 68, 0.4);
        color: #fecaca;
      }

      .chapter-summary {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }

      .chapter-edit-panel {
        margin-top: 12px;
        padding: 12px;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 12px;
        background: rgba(2, 6, 23, 0.55);
      }

      .chapter-edit-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }

      .chapter-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border-radius: 999px;
        border: 1px solid rgba(251, 191, 36, 0.35);
        background: rgba(251, 191, 36, 0.08);
        color: #fef3c7;
      }

      .chapter-pill button {
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 0.72rem;
        background: rgba(239, 68, 68, 0.16);
      }

      button {
        border: none;
        background: linear-gradient(135deg, #7c3aed, #ec4899);
        color: white;
        border-radius: 10px;
        padding: 12px 16px;
        font-weight: 700;
        cursor: pointer;
      }

      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .secondary {
        background: #1f2937;
      }

      .notice {
        display: none;
        margin-top: 14px;
        padding: 12px 14px;
        border-radius: 10px;
        font-size: 0.95rem;
      }

      .notice.success {
        display: block;
        background: rgba(16, 185, 129, 0.12);
        border: 1px solid rgba(16, 185, 129, 0.4);
        color: #a7f3d0;
      }

      .notice.error {
        display: block;
        background: rgba(239, 68, 68, 0.12);
        border: 1px solid rgba(239, 68, 68, 0.4);
        color: #fecaca;
      }

      .list {
        display: grid;
        gap: 14px;
        margin-top: 20px;
      }

      .item {
        display: flex;
        gap: 14px;
        align-items: center;
        background: rgba(15, 23, 42, 0.75);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 12px;
        padding: 12px;
      }

      .item img {
        width: 90px;
        height: 120px;
        object-fit: cover;
        border-radius: 8px;
        flex-shrink: 0;
      }

      .item strong {
        display: block;
        margin-bottom: 6px;
      }

      .item small {
        color: #cbd5e1;
      }

      @media (max-width: 860px) {
        .admin-panel {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <iframe
      id="menuFrame"
      src="menu.html"
      title="Menu"
      class="menu-iframe"
      style="width: 100%; height: 60px; border: none; overflow: hidden; display: block;"
      scrolling="no"
    ></iframe>

    <script>
      const menuFrame = document.getElementById('menuFrame');
      window.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'set-menu-height' && menuFrame) {
          menuFrame.style.height = `${Math.max(60, Number(event.data.height) || 60)}px`;
        }
      });
    </script>

    <main class="admin-wrap">
      <header class="admin-header">
        <h1>จัดการมังงะ</h1>
        <div id="profileWidget" class="profile-widget">ยังไม่ได้เข้าสู่ระบบ</div>
      </header>

      <div class="admin-panel">
        <section class="card">
          <h2>เข้าสู่ระบบแอดมิน</h2>
          <form id="loginForm">
            <label>
              Username
              <input type="text" id="username" value="admin" required />
            </label>
            <label>
              Password
              <input type="password" id="password" value="admin123" required />
            </label>
            <div class="actions">
              <button type="submit">เข้าสู่ระบบ</button>
              <button type="button" class="secondary" id="logoutBtn">ออกจากระบบ</button>
            </div>
          </form>
          <div id="authNotice" class="notice"></div>
        </section>

        <section class="card">
          <h2>เพิ่มมังงะใหม่</h2>
          <form id="mangaForm">
            <label>
              ชื่อเรื่อง
              <input type="text" id="title" placeholder="เช่น Kagurabachi" required />
            </label>
            <label>
              ลิงก์รูปภาพ
              <input type="url" id="imageUrl" placeholder="https://.../image.jpg" />
            </label>
            <label>
              อัปโหลดรูปจากเครื่อง
              <input type="file" id="imageFile" accept="image/*" />
            </label>
            <label>
              หรือวาง Data URL
              <textarea id="imageData" placeholder="วาง Data URL ของรูปที่นี่ หรือปล่อยว่างไว้ ถ้าจะใช้ URL หรือไฟล์จากเครื่อง"></textarea>
            </label>
            <label>
              รายละเอียดสั้น
              <textarea id="description" placeholder="เรื่องย่อ หรือรายละเอียดสั้นๆ"></textarea>
            </label>
            <div>
              <label>Chapter ของเรื่อง</label>
              <div id="chapterDraftList" class="chapter-list-editor"></div>
              <div class="actions" style="margin-top: 10px;">
                <button type="button" class="secondary" id="addChapterDraftBtn">เพิ่ม Chapter</button>
              </div>
            </div>
            <div class="actions">
              <button type="submit">เพิ่มรายการ</button>
              <button type="reset" class="secondary">ล้างฟอร์ม</button>
              <button type="button" class="secondary" id="resetGalleryBtn">คืนค่ามังงะเริ่มต้น</button>
            </div>
          </form>
          <div id="mangaNotice" class="notice"></div>
        </section>
      </div>

      <section class="card" style="margin-top: 24px;">
        <h3>รายการมังงะที่จัดเก็บ</h3>
        <div id="mangaList" class="list"></div>
      </section>
    </main>

    <script>
      const ADMIN_USERNAME = 'admin';
      const ADMIN_PASSWORD = 'admin123';
      const GALLERY_STORAGE_KEY = 'mangaGalleryItems';
      const defaultGalleryFiles = [
        'Kagurabachi.jpg',
        'Koutsugou Semi-Friend.jpg',
        "She's Likely Aiming for My Older Brother.jpg",
        'Tonari no Neko to Koi Shirazu.jpg',
        '[ R ] เพราะว่ารักเธอมันเจ็บ - Kimi Ni Aisarete Itakatta.jpg',
        'กางเขนสีชาด - JUUJIKA NO ROKUNIN「十字架のろくにん」.jpg',
        'ก่อนที่เธอจะกลายเป็นอสูรกาย.jpg',
        'คบชู้ ถูกกฏหมาย (Koushiki Furin).jpg',
        'มนต์รักตู้กดน้ำ (by ผู้อ่านทางบ้าน).jpg',
        'รุ่นพี่ไฮมิยะน่ากลัวแต่น่ารัก.jpg',
        'สกรีนช็อต 2026-05-28 202932.png',
        'สาบานรัก ราชันจอมเวท (Ousama no Propose).jpg',
        'เที่ยวไปกับสาวเกมเมอร์.jpg',
      ];

      const loginForm = document.getElementById('loginForm');
      const authNotice = document.getElementById('authNotice');
      const mangaForm = document.getElementById('mangaForm');
      const mangaNotice = document.getElementById('mangaNotice');
      const mangaList = document.getElementById('mangaList');
      const logoutBtn = document.getElementById('logoutBtn');
      const resetGalleryBtn = document.getElementById('resetGalleryBtn');
      const addChapterDraftBtn = document.getElementById('addChapterDraftBtn');
      const chapterDraftList = document.getElementById('chapterDraftList');

      function buildChapterName(index) {
        return `Chapter ${String(index).padStart(2, '0')}`;
      }

      function createDraftChapterRow(index, name = buildChapterName(index), pages = 3, pageImages = []) {
        const row = document.createElement('div');
        row.className = 'chapter-row';
        const safePages = Math.max(1, Number(pages) || 3);
        const normalizedPageImages = Array.isArray(pageImages) ? pageImages.slice(0, safePages).map((img) => String(img || '').trim()) : [];

        row.innerHTML = `
          <label>
            <span>ชื่อ</span>
            <input type="text" value="${escapeHtml(name)}" data-role="chapter-name" data-index="${index}" />
          </label>
          <label>
            <span>หน้า</span>
            <input type="number" min="1" value="${safePages}" data-role="chapter-pages" data-index="${index}" />
          </label>
          <label style="flex: 1 1 100%; min-width: 100%;">
            <span>ภาพต่อหน้า (อัปโหลดหรือใส่ URL ต่อหน้า)</span>
            <div class="page-image-grid">
              ${Array.from({ length: safePages }, (_, pageIndex) => {
                const pageImage = normalizedPageImages[pageIndex] || '';
                return `
                  <div class="page-image-card">
                    <label>
                      <span>หน้า ${pageIndex + 1}</span>
                      <input type="file" accept="image/*" data-role="page-file" data-index="${index}" data-page-index="${pageIndex}" />
                      <input type="url" value="${escapeHtml(pageImage)}" data-role="page-url" data-index="${index}" data-page-index="${pageIndex}" placeholder="URL / Data URL" />
                      <div class="page-image-preview">
                        ${pageImage ? `<img src="${escapeHtml(pageImage)}" alt="หน้า ${pageIndex + 1}" />` : '<span>ไม่มีรูป</span>'}
                      </div>
                      <button type="button" class="delete-page-image-btn" data-index="${index}" data-page-index="${pageIndex}" ${pageImage ? '' : 'disabled'}>ลบรูป</button>
                    </label>
                  </div>
                `;
              }).join('')}
            </div>
            <textarea data-role="chapter-page-images" data-index="${index}" placeholder="paste URL หรือ Data URL ต่อบรรทัด">${escapeHtml(normalizedPageImages.join('\n'))}</textarea>
          </label>
          <button type="button" class="remove-chapter-btn" data-index="${index}">ลบ</button>
        `;
        return row;
      }

      function refreshDraftChapterList() {
        const rows = [...chapterDraftList.querySelectorAll('.chapter-row')];
        if (!rows.length) {
          chapterDraftList.appendChild(createDraftChapterRow(1, buildChapterName(1), 3));
        }
      }

      function getDraftChapterList() {
        const rows = [...chapterDraftList.querySelectorAll('.chapter-row')];
        if (!rows.length) {
          return [{ name: 'Chapter 01', pages: 3, pageImages: ['', '', ''] }];
        }

        return rows.map((row, index) => {
          const nameInput = row.querySelector('[data-role="chapter-name"]');
          const pagesInput = row.querySelector('[data-role="chapter-pages"]');
          const pageUrlInputs = [...row.querySelectorAll('[data-role="page-url"]')];
          const textarea = row.querySelector('[data-role="chapter-page-images"]');

          const name = (nameInput?.value || buildChapterName(index + 1)).trim() || buildChapterName(index + 1);
          const pages = Math.max(1, Number(pagesInput?.value) || 3);

          const rawPageImages = pageUrlInputs.length
            ? Array.from({ length: pages }, (_, pageIndex) => {
                const element = row.querySelector(`[data-role="page-url"][data-page-index="${pageIndex}"]`);
                return String(element?.value || '').trim();
              })
            : (textarea?.value || '')
              .split(/\r?\n/)
              .map((line) => line.trim())
              .filter((line) => line.length > 0);

          const pageImages = Array.from({ length: pages }, (_, pageIndex) => rawPageImages[pageIndex] || '');
          return { name, pages, pageImages };
        });
      }

      function syncDraftChapterRow(row) {
        const pagesInput = row.querySelector('[data-role="chapter-pages"]');
        const pages = Math.max(1, Number(pagesInput?.value) || 3);
        const pageUrlFields = [...row.querySelectorAll('[data-role="page-url"]')];
        const currentValues = Array.from({ length: pages }, (_, pageIndex) => {
          const element = row.querySelector(`[data-role="page-url"][data-page-index="${pageIndex}"]`);
          return String(element?.value || '').trim();
        });

        const textarea = row.querySelector('[data-role="chapter-page-images"]');
        if (textarea) {
          textarea.value = currentValues.join('\n');
        }

        pageUrlFields.forEach((field) => {
          const pageIndex = Number(field.dataset.pageIndex || 0);
          const value = currentValues[pageIndex] || '';
          const preview = field.closest('.page-image-card')?.querySelector('.page-image-preview');
          const button = field.closest('.page-image-card')?.querySelector('.delete-page-image-btn');

          if (preview) {
            if (value) {
              preview.innerHTML = `<img src="${escapeHtml(value)}" alt="หน้า ${pageIndex + 1}" />`;
            } else {
              preview.innerHTML = '<span>ไม่มีรูป</span>';
            }
          }

          if (button) {
            button.disabled = !value;
          }
        });
      }

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function getDisplayName(fileName) {
        const cleaned = String(fileName || '').replace(/\.[^/.]+$/, '');
        return cleaned.replace(/[-_]+/g, ' ').replace(/\s{2,}/g, ' ').trim() || 'Image';
      }

      function toSlug(value) {
        return String(value || '')
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/[^a-z0-9\s-]/g, '')
          .trim()
          .replace(/\s+/g, '-')
          .replace(/-+/g, '-');
      }

      function getDefaultGalleryItems() {
        return defaultGalleryFiles.map((fileName) => ({
          title: getDisplayName(fileName),
          image: `img/${fileName}`,
          slug: toSlug(getDisplayName(fileName)),
          description: 'เรื่องราวที่น่าติดตามในทุกตอน',
          createdBy: 'system',
          role: 'admin',
          chapters: [{ name: 'Chapter 01', pages: 3, pageImages: ['', '', ''] }],
        }));
      }

      function showNotice(element, message, type) {
        element.textContent = message;
        element.className = `notice ${type}`;
      }

      function normalizeChapter(chapter, fallbackIndex = 1) {
        const name = chapter && chapter.name ? chapter.name.trim() : `Chapter ${String(fallbackIndex).padStart(2, '0')}`;
        const pages = Number(chapter && chapter.pages) > 0 ? Number(chapter.pages) : 3;
        const pageImages = Array.isArray(chapter && chapter.pageImages)
          ? chapter.pageImages.slice(0, pages).map((img) => String(img || '').trim())
          : Array.from({ length: pages }, () => '');
        return { name, pages, pageImages };
      }

      function createDefaultChapterSet() {
        return [{ name: 'Chapter 01', pages: 3, pageImages: ['', '', ''] }];
      }

      function ensureItemStructure(item, index = 0) {
        const safeItem = item && typeof item === 'object' ? item : {};
        const chapters = Array.isArray(safeItem.chapters) && safeItem.chapters.length
          ? safeItem.chapters.map((chapter, chapterIndex) => normalizeChapter(chapter, chapterIndex + 1))
          : createDefaultChapterSet();

        return {
          title: safeItem.title || `Manga ${index + 1}`,
          image: safeItem.image || '',
          description: safeItem.description || '',
          slug: safeItem.slug || toSlug(safeItem.title || `Manga ${index + 1}`),
          isCustom: Boolean(safeItem.isCustom),
          createdBy: safeItem.createdBy || 'system',
          role: safeItem.role || 'admin',
          chapters,
        };
      }

      function getGalleryItems() {
        try {
          const value = localStorage.getItem(GALLERY_STORAGE_KEY);
          if (!value) {
            return getDefaultGalleryItems();
          }
          const parsed = JSON.parse(value);
          if (!Array.isArray(parsed)) {
            return getDefaultGalleryItems();
          }
          return parsed.map((item, index) => ensureItemStructure(item, index));
        } catch (error) {
          return getDefaultGalleryItems();
        }
      }

      function saveGalleryItems(items) {
        localStorage.setItem(GALLERY_STORAGE_KEY, JSON.stringify(items.map((item, index) => ensureItemStructure(item, index))));
      }

      function isLoggedIn() {
        return localStorage.getItem('adminLoggedIn') === 'true';
      }

      function getMemberAccounts() {
        try {
          const stored = localStorage.getItem('mangaUserAccounts');
          return stored ? JSON.parse(stored) : [];
        } catch (error) {
          return [];
        }
      }

      function saveMemberAccounts(accounts) {
        localStorage.setItem('mangaUserAccounts', JSON.stringify(accounts));
      }

      function getCurrentUser() {
        try {
          const stored = localStorage.getItem('mangaCurrentUser');
          return stored ? JSON.parse(stored) : null;
        } catch (error) {
          return null;
        }
      }

      function setCurrentUser(user) {
        localStorage.setItem('mangaCurrentUser', JSON.stringify(user));
      }

      function clearCurrentUser() {
        localStorage.removeItem('mangaCurrentUser');
      }

      function isMemberLoggedIn() {
        const user = getCurrentUser();
        return !!user && user.role === 'user';
      }

      function canManageItem(item) {
        if (isLoggedIn()) return true;
        const user = getCurrentUser();
        return !!user && item && item.createdBy === user.username;
      }

      function renderUserProfile() {
        const user = getCurrentUser();
        const profileBox = document.getElementById('profileWidget');

        if (!user) {
          profileBox.innerHTML = 'ยังไม่ได้เข้าสู่ระบบ<br />สมัครสมาชิกในหน้า <a href="member.html" target="_self" style="color:#fbbf24;">สมาชิก</a>';
          return;
        }

        profileBox.innerHTML = `
          <strong>ชื่อผู้ใช้:</strong> ${escapeHtml(user.username)}<br />
          <strong>บทบาท:</strong> สมาชิกทั่วไป<br />
          <strong>สถานะ:</strong> อัปโหลดและจัดการเรื่องของตัวเองเท่านั้น
        `;
      }

      function updateAuthState() {
        const adminLogged = isLoggedIn();
        const memberLogged = isMemberLoggedIn();
        const canUpload = adminLogged || memberLogged;

        document.getElementById('title').disabled = !canUpload;
        document.getElementById('imageUrl').disabled = !canUpload;
        document.getElementById('imageData').disabled = !canUpload;
        document.getElementById('imageFile').disabled = !canUpload;
        document.getElementById('description').disabled = !canUpload;
        document.querySelector('#mangaForm button[type="submit"]').disabled = !canUpload;
        document.querySelector('#mangaForm button[type="reset"]').disabled = !canUpload;

        if (adminLogged) {
          showNotice(authNotice, 'เข้าสู่ระบบแอดมินแล้ว', 'success');
        } else if (memberLogged) {
          showNotice(authNotice, `เข้าสู่ระบบสมาชิกแล้ว: ${getCurrentUser().username}`, 'success');
        } else {
          showNotice(authNotice, 'ยังไม่ได้เข้าสู่ระบบ กรุณาเข้าสู่ระบบก่อนเพิ่มมังงะ', 'error');
        }

        renderUserProfile();
      }

      function renderMangaList() {
        const items = getGalleryItems();
        if (!items.length) {
          mangaList.innerHTML = '<p style="color:#cbd5e1;">ยังไม่มีรายการมังงะ</p>';
          return;
        }

        mangaList.innerHTML = items
          .map((item, index) => {
            const creatorText = item.createdBy && item.createdBy !== 'system' ? `โดย: ${escapeHtml(item.createdBy)}` : 'ระบบเริ่มต้น';
            const chapterPills = Array.isArray(item.chapters) && item.chapters.length
              ? item.chapters.map((chapter, chapterIndex) => `
                  <span class="chapter-pill">
                    ${escapeHtml(chapter.name || buildChapterName(chapterIndex + 1))}
                    <button type="button" class="delete-chapter-btn" data-item-index="${index}" data-chapter-index="${chapterIndex}">ลบ</button>
                  </span>
                `).join('')
              : '<span class="chapter-pill">Chapter 01</span>';

            const chapterControls = `
              <div class="chapter-inline">
                <button type="button" class="secondary add-chapter-btn" data-index="${index}">เพิ่ม Chapter</button>
              </div>
              <div class="chapter-summary">${chapterPills}</div>
            `;

            const chapterEditor = (Array.isArray(item.chapters) && item.chapters.length
              ? item.chapters.map((chapter, chapterIndex) => {
                  const updatedPages = Array.isArray(chapter.pageImages) ? chapter.pageImages : [];
                  const pageCards = Array.from({ length: Math.max(1, Number(chapter.pages) || 3) }, (_, pageIndex) => {
                    const pageImage = updatedPages[pageIndex] || '';
                    return `
                      <div class="page-image-card">
                        <label>
                          <span>หน้า ${pageIndex + 1}</span>
                          <input type="file" accept="image/*" data-role="page-file" data-item-index="${index}" data-chapter-index="${chapterIndex}" data-page-index="${pageIndex}" />
                          <input type="url" value="${escapeHtml(pageImage)}" data-role="page-url" data-item-index="${index}" data-chapter-index="${chapterIndex}" data-page-index="${pageIndex}" placeholder="URL / Data URL" />
                          <div class="page-image-preview">
                            ${pageImage ? `<img src="${escapeHtml(pageImage)}" alt="หน้า ${pageIndex + 1}" />` : '<span>ไม่มีรูป</span>'}
                          </div>
                          <button type="button" class="delete-page-image-btn" data-item-index="${index}" data-chapter-index="${chapterIndex}" data-page-index="${pageIndex}" ${pageImage ? '' : 'disabled'}>ลบรูป</button>
                        </label>
                      </div>
                    `;
                  }).join('');

                  return `
                    <div class="chapter-edit-panel">
                      <div class="chapter-edit-header">
                        <strong>${escapeHtml(chapter.name || buildChapterName(chapterIndex + 1))}</strong>
                        <button type="button" class="save-chapter-page-btn" data-item-index="${index}" data-chapter-index="${chapterIndex}">บันทึก Chapter</button>
                      </div>
                      <label>
                        <span>จำนวนหน้า</span>
                        <input type="number" min="1" value="${Math.max(1, Number(chapter.pages) || 3)}" data-role="chapter-pages" data-item-index="${index}" data-chapter-index="${chapterIndex}" />
                      </label>
                      <div class="page-image-grid">${pageCards}</div>
                    </div>
                  `;
                }).join('')
              : '') || '';

            const canDelete = canManageItem(item);
            const deleteButton = canDelete
              ? `<button type="button" class="secondary delete-btn" data-index="${index}" aria-label="ลบ ${escapeHtml(item.title)}">ลบ</button>`
              : '';

            return `
              <div class="item">
                <img src="${escapeHtml(item.image)}" alt="${escapeHtml(item.title)}" />
                <div>
                  <strong>${escapeHtml(item.title)}</strong>
                  <small>${escapeHtml(item.description || 'ไม่มีรายละเอียด')}</small>
                  <small>${creatorText}</small>
                  ${chapterControls}
                  ${chapterEditor}
                </div>
                ${deleteButton}
              </div>
            `;
          })
          .join('');
      }

      function restoreDefaultGallery() {
        const defaultItems = getDefaultGalleryItems();
        saveGalleryItems(defaultItems);
        renderMangaList();
        showNotice(mangaNotice, 'คืนค่ากลับสู่รายการมังงะเริ่มต้นแล้ว', 'success');
      }

      loginForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
          localStorage.setItem('adminLoggedIn', 'true');
          showNotice(authNotice, 'เข้าสู่ระบบสำเร็จ', 'success');
          updateAuthState();
          renderMangaList();
        } else {
          showNotice(authNotice, 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง', 'error');
        }
      });

      logoutBtn.addEventListener('click', () => {
        localStorage.removeItem('adminLoggedIn');
        clearCurrentUser();
        showNotice(authNotice, 'ออกจากระบบแล้ว', 'success');
        updateAuthState();
      });

      resetGalleryBtn.addEventListener('click', () => {
        if (!isLoggedIn()) {
          showNotice(mangaNotice, 'กรุณาเข้าสู่ระบบแอดมินก่อน', 'error');
          return;
        }
        restoreDefaultGallery();
      });

      mangaList.addEventListener('click', (event) => {
        const saveChapterPageBtn = event.target.closest('.save-chapter-page-btn');
        if (saveChapterPageBtn) {
          if (!(isLoggedIn() || isMemberLoggedIn())) {
            showNotice(mangaNotice, 'กรุณาเข้าสู่ระบบก่อน', 'error');
            return;
          }

          const itemIndex = Number(saveChapterPageBtn.dataset.itemIndex);
          const chapterIndex = Number(saveChapterPageBtn.dataset.chapterIndex);
          const items = getGalleryItems();
          const item = items[itemIndex];
          if (!item || !canManageItem(item)) {
            showNotice(mangaNotice, 'คุณไม่มีสิทธิ์แก้ไข chapter นี้', 'error');
            return;
          }

          const panel = saveChapterPageBtn.closest('.chapter-edit-panel');
          if (!panel) {
            return;
          }

          const pagesInput = panel.querySelector('[data-role="chapter-pages"]');
          const pageValues = [...panel.querySelectorAll('[data-role="page-url"]')]
            .map((input) => String(input.value || '').trim())
            .filter((value) => value.length > 0);

          const pages = Math.max(1, Number(pagesInput?.value) || 3);
          const chapter = item.chapters[chapterIndex] || { name: buildChapterName(chapterIndex + 1), pages: 3, pageImages: [] };
          chapter.name = chapter.name || buildChapterName(chapterIndex + 1);
          chapter.pages = pages;
          chapter.pageImages = Array.from({ length: pages }, (_, pageIndex) => {
            const urlInput = panel.querySelector(`[data-role="page-url"][data-page-index="${pageIndex}"]`);
            return String(urlInput?.value || '').trim();
          });

          saveGalleryItems(items);
          renderMangaList();
          showNotice(mangaNotice, 'บันทึกภาพ chapter สำเร็จ', 'success');
          return;
        }

        const deleteChapterBtn = event.target.closest('.delete-chapter-btn');
        if (deleteChapterBtn) {
          if (!(isLoggedIn() || isMemberLoggedIn())) {
            showNotice(mangaNotice, 'กรุณาเข้าสู่ระบบก่อน', 'error');
            return;
          }

          const itemIndex = Number(deleteChapterBtn.dataset.itemIndex);
          const chapterIndex = Number(deleteChapterBtn.dataset.chapterIndex);
          const items = getGalleryItems();
          const item = items[itemIndex];
          if (!item || !canManageItem(item)) {
            showNotice(mangaNotice, 'คุณไม่มีสิทธิ์ลบ chapter นี้', 'error');
            return;
          }

          if (!Array.isArray(item.chapters) || !item.chapters.length) {
            return;
          }

          if (item.chapters.length <= 1) {
            showNotice(mangaNotice, 'ต้องมี Chapter อย่างน้อย 1 chapter', 'error');
            return;
          }

          item.chapters.splice(chapterIndex, 1);
          saveGalleryItems(items);
          renderMangaList();
          showNotice(mangaNotice, 'ลบ Chapter สำเร็จ', 'success');
          return;
        }

        const addChapterBtn = event.target.closest('.add-chapter-btn');
        if (addChapterBtn) {
          if (!(isLoggedIn() || isMemberLoggedIn())) {
            showNotice(mangaNotice, 'กรุณาเข้าสู่ระบบก่อน', 'error');
            return;
          }

          const index = Number(addChapterBtn.dataset.index);
          const items = getGalleryItems();
          const item = items[index];
          if (!item || !canManageItem(item)) {
            showNotice(mangaNotice, 'คุณไม่มีสิทธิ์เพิ่ม chapter ให้เรื่องนี้', 'error');
            return;
          }

          const currentChapters = Array.isArray(item.chapters) && item.chapters.length ? item.chapters : createDefaultChapterSet();
          const nextNumber = currentChapters.length + 1;
          currentChapters.push({
            name: buildChapterName(nextNumber),
            pages: 3,
            pageImages: ['', '', ''],
          });

          item.chapters = currentChapters;
          saveGalleryItems(items);
          renderMangaList();
          showNotice(mangaNotice, `เพิ่ม ${buildChapterName(nextNumber)} สำเร็จ`, 'success');
          return;
        }

        const removeBtn = event.target.closest('.delete-btn');
        if (!removeBtn) {
          return;
        }

        if (!(isLoggedIn() || isMemberLoggedIn())) {
          showNotice(mangaNotice, 'กรุณาเข้าสู่ระบบก่อน', 'error');
          return;
        }

        const index = Number(removeBtn.dataset.index);
        const items = getGalleryItems();
        if (Number.isNaN(index) || index < 0 || index >= items.length) {
          return;
        }

        const item = items[index];
        if (!item || !canManageItem(item)) {
          showNotice(mangaNotice, 'คุณไม่มีสิทธิ์ลบรายการนี้', 'error');
          return;
        }

        items.splice(index, 1);
        saveGalleryItems(items);
        renderMangaList();
        showNotice(mangaNotice, 'ลบรายการสำเร็จ', 'success');
      });

      addChapterDraftBtn.addEventListener('click', () => {
        const rows = [...chapterDraftList.querySelectorAll('.chapter-row')];
        const nextIndex = rows.length + 1;
        chapterDraftList.appendChild(createDraftChapterRow(nextIndex, buildChapterName(nextIndex), 3));
      });

      chapterDraftList.addEventListener('click', (event) => {
        const removeBtn = event.target.closest('.remove-chapter-btn');
        if (removeBtn) {
          const rows = [...chapterDraftList.querySelectorAll('.chapter-row')];
          if (rows.length <= 1) {
            return;
          }

          const targetIndex = Number(removeBtn.dataset.index);
          const targetRow = rows.find((row) => Number(row.querySelector('[data-role="chapter-name"]')?.dataset.index) === targetIndex);
          if (targetRow) {
            targetRow.remove();
          }
          return;
        }

        const deletePageBtn = event.target.closest('.delete-page-image-btn');
        if (!deletePageBtn) {
          return;
        }

        const row = deletePageBtn.closest('.chapter-row');
        if (!row) {
          return;
        }

        const pageIndex = Number(deletePageBtn.dataset.pageIndex || 0);
        const urlField = row.querySelector(`[data-role="page-url"][data-page-index="${pageIndex}"]`);
        if (urlField) {
          urlField.value = '';
        }
        const fileField = row.querySelector(`[data-role="page-file"][data-page-index="${pageIndex}"]`);
        if (fileField) {
          fileField.value = '';
        }
        syncDraftChapterRow(row);
      });

      document.addEventListener('click', (event) => {
        const deletePageBtn = event.target.closest('.delete-page-image-btn');
        if (!deletePageBtn) {
          return;
        }

        const itemIndex = deletePageBtn.dataset.itemIndex;
        const chapterIndex = deletePageBtn.dataset.chapterIndex;
        const pageIndex = deletePageBtn.dataset.pageIndex;

        if (itemIndex !== undefined && chapterIndex !== undefined && pageIndex !== undefined) {
          const items = getGalleryItems();
          const item = items[Number(itemIndex)];
          if (!item || !canManageItem(item)) {
            showNotice(mangaNotice, 'คุณไม่มีสิทธิ์ลบรูปนี้', 'error');
            return;
          }

          const chapter = item.chapters?.[Number(chapterIndex)];
          if (chapter && Array.isArray(chapter.pageImages)) {
            chapter.pageImages[Number(pageIndex)] = '';
            saveGalleryItems(items);
            renderMangaList();
            showNotice(mangaNotice, 'ลบรูปในหน้า chapter แล้ว', 'success');
          }
        }
      });

      document.addEventListener('change', (event) => {
        if (event.target.matches('[data-role="page-file"]')) {
          const file = event.target.files && event.target.files[0];
          if (!file) {
            return;
          }

          const reader = new FileReader();
          reader.onload = () => {
            const urlField = event.target.closest('.page-image-card')?.querySelector('[data-role="page-url"]');
            if (urlField) {
              urlField.value = String(reader.result || '');
            }
          };
          reader.readAsDataURL(file);
        }
      });

      chapterDraftList.addEventListener('change', (event) => {
        const row = event.target.closest('.chapter-row');
        if (!row) {
          return;
        }

        if (event.target.matches('[data-role="chapter-pages"]')) {
          const pages = Math.max(1, Number(event.target.value) || 3);
          const currentRows = [...row.querySelectorAll('[data-role="page-url"]')];
          const currentCount = currentRows.length;

          if (pages > currentCount) {
            const pageImages = Array.from({ length: pages }, (_, pageIndex) => {
              const existing = row.querySelector(`[data-role="page-url"][data-page-index="${pageIndex}"]`);
              return existing ? String(existing.value || '').trim() : '';
            });
            row.querySelector('.page-image-grid').innerHTML = Array.from({ length: pages }, (_, pageIndex) => {
              const value = pageImages[pageIndex] || '';
              return `
                <div class="page-image-card">
                  <label>
                    <span>หน้า ${pageIndex + 1}</span>
                    <input type="file" accept="image/*" data-role="page-file" data-index="${row.querySelector('[data-role="chapter-name"]')?.dataset.index || 1}" data-page-index="${pageIndex}" />
                    <input type="url" value="${escapeHtml(value)}" data-role="page-url" data-index="${row.querySelector('[data-role="chapter-name"]')?.dataset.index || 1}" data-page-index="${pageIndex}" placeholder="URL / Data URL" />
                    <div class="page-image-preview">
                      ${value ? `<img src="${escapeHtml(value)}" alt="หน้า ${pageIndex + 1}" />` : '<span>ไม่มีรูป</span>'}
                    </div>
                    <button type="button" class="delete-page-image-btn" data-index="${row.querySelector('[data-role="chapter-name"]')?.dataset.index || 1}" data-page-index="${pageIndex}" ${value ? '' : 'disabled'}>ลบรูป</button>
                  </label>
                </div>
              `;
            }).join('');
          }

          syncDraftChapterRow(row);
          return;
        }

        if (event.target.matches('[data-role="page-file"]')) {
          const file = event.target.files && event.target.files[0];
          if (!file) {
            return;
          }

          const reader = new FileReader();
          reader.onload = () => {
            const pageIndex = Number(event.target.dataset.pageIndex || 0);
            const urlField = row.querySelector(`[data-role="page-url"][data-page-index="${pageIndex}"]`);
            if (urlField) {
              urlField.value = String(reader.result || '');
            }
            syncDraftChapterRow(row);
          };
          reader.readAsDataURL(file);
          return;
        }

        if (event.target.matches('[data-role="page-url"]')) {
          syncDraftChapterRow(row);
        }
      });

      document.getElementById('imageFile').addEventListener('change', function (event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = () => {
          document.getElementById('imageData').value = String(reader.result || '');
          showNotice(mangaNotice, 'เลือกรูปจากเครื่องแล้ว พร้อมใช้งาน', 'success');
        };
        reader.readAsDataURL(file);
      });

      mangaForm.addEventListener('submit', (event) => {
        event.preventDefault();
        if (!(isLoggedIn() || isMemberLoggedIn())) {
          showNotice(mangaNotice, 'กรุณาเข้าสู่ระบบก่อน', 'error');
          return;
        }

        const title = document.getElementById('title').value.trim();
        let image = document.getElementById('imageUrl').value.trim();
        const description = document.getElementById('description').value.trim();
        const dataUrl = document.getElementById('imageData').value.trim();

        if (!title || (!image && !dataUrl)) {
          showNotice(mangaNotice, 'กรุณากรอกชื่อเรื่องและลิงก์รูปภาพหรืออัปโหลดรูปจากเครื่อง', 'error');
          return;
        }

        if (!image && dataUrl) {
          image = dataUrl;
        }

        const itemChapters = getDraftChapterList();
        const items = getGalleryItems();
        const currentUser = getCurrentUser();
        const creator = currentUser ? currentUser.username : (isLoggedIn() ? 'admin' : 'guest');
        const newItem = {
          title,
          image,
          description,
          isCustom: true,
          role: isLoggedIn() ? 'admin' : 'user',
          createdBy: creator,
          chapters: itemChapters.length ? itemChapters : [{ name: 'Chapter 01', pages: 3, pageImages: ['', '', ''] }],
        };

        const mergedItems = [newItem, ...items];
        saveGalleryItems(mergedItems);
        showNotice(mangaNotice, 'เพิ่มรายการสำเร็จ พร้อม chapter แล้ว', 'success');
        mangaForm.reset();
        document.getElementById('imageData').value = '';
        chapterDraftList.innerHTML = '';
        chapterDraftList.appendChild(createDraftChapterRow(1, 'Chapter 01', 3));
        renderMangaList();
      });

      updateAuthState();
      chapterDraftList.innerHTML = '';
      chapterDraftList.appendChild(createDraftChapterRow(1, 'Chapter 01', 3));
      renderMangaList();
    </script>
  </body>
</html>
